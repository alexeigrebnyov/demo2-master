<div>
    <div class="row rowColor" >

        <nav class="nav col-md-12" >
            <a class="nav-link" th:href="@{/}">Главная</a>

                <div class="tab-content">

                                    <input type="submit" class="btn btn-primary" value="Сформировать списки">
                                    <input type="hidden" name="redir" id="redirProof" value="redirect:/code">
                                </form>

                            </div>
                            <div class="bg-white">
                                <br>
                            </div>
                        </div>

                        <table class="table table-striped" border="1">
                            <tr>
                                <th>№</th>
                                <th>ЭМК</th>
                                <th>ФИО</th>
                                <th>Дата забора</th>
                                <th>Код забора</th>
                                <th>ВИЧ</th>
                                <th>HBsAg</th>
                                <th>Anti-HCV</th>
                                <th>SyphIFA</th>
                                <th>МРП</th>
                                <th>Филиал</th>
<!--                                <th>Статус</th>-->
                            </tr>
                            <div id="dataRowDiv"></div>

                            <th:block th:each = "cont:${selected}">
                                <tr>
                                    <td th:utext="${selected.indexOf(cont)+1}"></td>
                                    <td th:utext="${cont.emc}"></td>
                                    <td th:utext="${cont.fio}"></td>
                                    <td th:utext="${cont.date_bio}"></td>
                                    <td th:utext="${cont.code}"></td>
                                    <td th:utext="${cont.rubG}"></td>
                                    <td th:utext="${cont.rubM}"></td>
                                    <td th:utext="${cont.HSP60}"></td>
                                    <td th:utext="${cont.clamA}"></td>
                                    <td th:utext="${cont.clamG}"></td>
                                    <td th:utext="${cont.label}"></td>
                                    <td >
                                        <form name="delForm" id="delForm" th:action="@{/deleteanalysis}" method="post">
                                            <input type="hidden" name="delete" id="deleteanalysis" th:value="*{cont.emc}">
                                            <input type="hidden" name="deleteProof" id="deleteProof" value="torch">
                                            <!--                                        <input type="text" name="codeInt" id="codeInt" >-->
                                            <input type="submit" class="btn btn-danger" value="Удалить">
                                        </form>
                                    </td>

                            </th:block>

                            </tr>
                        </table>

                </div>

            </div>

        </div>

    </div>
</div>
</div>
</div>

<script>
    function t() {
        fetch('/update/code').then(
            (res)=>res.json()
                .then((data) => {
                        data.forEach( function (some) {
                            // document.getElementById("code_update").innerHTML=`<input type="text" name="codeInt" id="codeInt" value="${some}">`
                            if (some!=null) {
                                let params = {
                                    codeInt: some,
                                    proofCode: '',
                                    redir: 'redirect:/codeTorch',
                                    done: 'and PATDIREC.QUANTITY_DONE=0',
                                    grpprm: '1'



                                }
                                fetch('/code', {
                                    method: 'POST',
                                    headers: {
                                        'Content-Type': 'application/json;charset=utf-8'
                                    },
                                    body: JSON.stringify(params)
                                })

                                setTimeout("location.reload(true)", 1000)
                            }


                        })
                    }
                ))

    }
    $( (function () {
        t();
        setInterval('t()', 1000)
    }));
</script>
