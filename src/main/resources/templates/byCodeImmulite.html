<script>


    function getList(code=''){
        let row = ''
        let count = 1
        fetch('/immulite/gormonu/'+code+'/0')
            .then((res)=>res.json()
                .then((data) => {
                    data.forEach( function (analys) {
                        row+=`<tr>               <td>${count}</td>
                                                <td >${analys.emc}</td>
                                                <td >${analys.fio}</td>
                                                <td >${analys.date_bio}</td>
                                                <td >${analys.code}</td>
                                                <td >${analys.hiv}</td>
                                                <td >${analys.hbsAg}</td>
                                                <td >${analys.atHCV}</td>
                                                <td >${analys.syphIFA}</td>
                                                <td >${analys.rubM}</td>
                                                <td >${analys.rubG}</td>
                                                <td >${analys.clamG}</td>
                                                <td >${analys.syphMRP}</td>
                                                <td >${analys.clamA}</td>
                                                <td >${analys.sbg}</td>
                                                <td >${analys.dga}</td>
                                                <td >${analys.label}</td>
                                                <td ><button class="btn-danger" onclick="dele(${analys.emc})">Удалить</button></td>
                                                // <td class="font-weight-bold text-danger">${analys.immChek}</td>
                                                    </tr>`
                        // console.log(row)
                        setDiv(row)
                        count++})

                }))
        window.scrollBy(0, 2)
    }

</script>

<script>


    function getDoneList() {
        let rowDone = ''
        let count = 1


        // if (succes === 1) {
            fetch('/immulite/chekGormonu/')
                .then((res) => res.json()
                    .then((data) => {
                        data.forEach(function (analys) {
                            rowDone += `<tr>    <td>${count}</td>
                                                <td >${analys.emc}</td>
                                                <td >${analys.fio}</td>
                                                <td >${analys.date_bio}</td>
                                                <td >${analys.code}</td>
                                                <td >${analys.resultHiv!=null?analys.resultHiv:''}</td>
                                                <td >${analys.resultHbsAg!=null?analys.resultHbsAg:''}</td>
                                                <td >${analys.resultatHCV!=null?analys.resultatHCV:''}</td>
                                                <td >${analys.resultSyphIfa!=null?analys.resultSyphIfa:''}</td>
                                                   <td >${analys.resultRubM!=null?analys.resultRubM:''}</td>
                                                   <td >${analys.resultRubG!=null?analys.resultRubG:''}</td>
                                                    <td >${analys.resultClamG!=null?analys.resultClamG:''}</td>
                                                    <td >${analys.resultMRP!=null?analys.resultMRP:''}</td>
                                                    <td >${analys.resultClamA!=null?analys.resultClamA:''}</td>
                                                    <td >${analys.resultHSP60!=null?analys.resultHSP60:''}</td>
                                                    <td >${analys.resultDGA!=null?analys.resultDGA:''}</td>
                                                <td >${analys.label}</td>
                                                <td class="font-weight-bold text-danger">${analys.immChek}</td>
                                                    </tr>`
                            // console.log(rowDone)
                            setDiv(rowDone)
                            count++
                        })
                    }))
        window.scrollBy(0, 2)
        // }
    }
</script>
