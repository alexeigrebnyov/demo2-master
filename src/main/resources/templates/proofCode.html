<script>
    function t() {
        fetch('/update/code').then(
            (res)=>res.json()
                .then((data) => {
                        data.forEach( function (some) {
                            // document.getElementById("code_update").innerHTML=`<input type="text" name="codeInt" id="codeInt" value="${some}">`
                            if (some!=null) {
                                let params = {
                                    codeInt: '',
                                    proofCode: some,
                                    redir: 'redirect:/proofCode',
                                    done: 'and PATDIREC.QUANTITY_DONE=0',
                                    grpprm: '350'



                                }
                                fetch('/code', {
                                    method: 'POST',
                                    headers: {
                                        'Content-Type': 'application/json;charset=utf-8'
                                    },
                                    body: JSON.stringify(params)
                                })

                                setTimeout("location.reload(true)", 1000)
                            }


                        })
                    }
                ))

    }
    $( (function () {
        t();
        setInterval('t()', 1000)
    }));
</script>
